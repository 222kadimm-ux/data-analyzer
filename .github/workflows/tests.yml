name: Run Pytest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest polars pandas numpy sqlalchemy streamlit
        pip install -r requirements.txt || true
    - name: Test with pytest
      run: |
        # اختبار بسيط جداً للتأكد من أن الكود الأساسي يعمل
        python -c "from core_engine import DataEngine; print('Import OK')"
